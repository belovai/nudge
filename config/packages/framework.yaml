# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Comma-separated IPs/CIDRs of reverse proxies whose X-Forwarded-* headers are trusted
    # (e.g. "10.42.0.0/16" for the k3s pod network, or "REMOTE_ADDR", "PRIVATE_SUBNETS").
    # Empty: no proxy is trusted and the client IP is the TCP peer.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true
    serializer:
        enabled: true
        name_converter: 'serializer.name_converter.camel_case_to_snake_case'
when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
