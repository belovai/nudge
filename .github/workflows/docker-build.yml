name: 'Docker Build'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bump version (major.minor.patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Own group per workflow, so a dev build can't cancel a release.
# No cancel-in-progress: the version is already bumped in Nudge when the build starts,
# so cancelling a running release would burn a version. A newer run waits instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.show-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        uses: fjogeleit/http-request-action@v1
        with:
          url: "https://nudge.belovai.com/api/${{ secrets.NUDGE_UUID }}/${{ inputs.version }}"
          data: |
            {
              "context": {
                "repo": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "actor": "${{ github.actor }}",
                "hash": "${{ github.sha }}"
              }
            }

      - name: Show Response
        id: show-version
        run: |
          echo "version=${{ fromJson(steps.version.outputs.response).data.version }}" >> $GITHUB_OUTPUT

  tag:
    name: Git Tag
    runs-on: ubuntu-latest
    # Tag only a version whose image was actually built and pushed.
    needs: [prepare, build-and-push]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if tag exists
        id: tag_exists
        run: |
          TAG=${{ needs.prepare.outputs.app_version }}
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        uses: actions/github-script@v6
        if: steps.tag_exists.outputs.exists == 'false'
        with:
          script: |
            github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${{ needs.prepare.outputs.app_version }}`,
                sha: context.sha
            })

  build-and-push:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, zip, zlib, bcmath, ctype, fileinfo, json, mbstring, openssl, tokenizer, xml
          coverage: none
          ini-values: memory_limit=-1

      - name: Setup Composer Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          # Separate from the Tests cache, which holds dev dependencies.
          key: composer-nodev-${{ hashFiles('composer.lock') }}

      - name: Set up environment
        run: cp .env.example .env

      - name: Run composer install
        # No dev dependencies in the image. APP_ENV=prod so the post-install cache:clear
        # doesn't try to boot dev-only bundles that are not installed.
        env:
          APP_ENV: prod
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Set up meta.json
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > meta.json
          {
            "hash": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "branch": "${{ github.ref_name }}",
            "version": "${{ needs.prepare.outputs.app_version }}",
            "gh_action_run_id": "${{ github.run_id }}",
            "at": "$DATE"
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.app_version }}

      - name: Build docker nginx and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
