version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Staying on the 7.4 LTS line on purpose; a major Symfony upgrade is a manual decision.
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
    # One PR per family instead of one per package (Symfony alone is ~40 packages).
    groups:
      symfony:
        patterns:
          - "symfony/*"
      doctrine:
        patterns:
          - "doctrine/*"
          - "gedmo/*"
          - "stof/*"
      api-platform:
        patterns:
          - "api-platform/*"
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
