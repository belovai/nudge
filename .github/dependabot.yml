version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are upgraded deliberately, not by bot (e.g. DBAL 3 -> 4 is a
    # migration; staying on the Symfony 7.4 LTS line is a choice). Minor/patch updates
    # still come weekly, and security updates are not affected by this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # One PR per family instead of one per package (Symfony alone is ~40 packages).
    groups:
      symfony:
        patterns:
          - "symfony/*"
      doctrine:
        patterns:
          - "doctrine/*"
          - "gedmo/*"
          - "stof/*"
      api-platform:
        patterns:
          - "api-platform/*"
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
